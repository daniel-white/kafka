[package]
name = "kafka-protocol"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
thiserror = "2.0"
getset = "0.1.7"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
kafka-common = { path = "../kafka-common" }
kafka-errors = { path = "../kafka-errors" }
tokio = { version = "1.0", features = ["net", "io-util", "rt"] }

[build-dependencies]
serde_json = "1.0"
json_comments = "0.2"

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
rstest = "0.22"