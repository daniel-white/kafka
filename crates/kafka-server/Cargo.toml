[package]
name = "kafka-server"
version = "0.1.0"
edition = "2021"

[dependencies]
getset = "0.1"
kafka-common = { path = "../kafka-common" }
kafka-server-common = { path = "../kafka-server-common" }
kafka-protocol = { path = "../kafka-protocol" }
kafka-record = { path = "../kafka-record" }
kafka-storage = { path = "../kafka-storage" }
tokio = { version = "1.0", features = ["full"] }
thiserror = "2"
fast-stm = "0.7"

[dev-dependencies]
rdkafka = { version = "0.39", features = ["tokio"] }

[lints.rust]
unsafe_code = "deny"
